<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Relocation Tracker — Project Alanya</title>
<style>
  :root {
    --crimson: #C41230;
    --ink: #141414;
    --paper: #ffffff;
    --grey: #6b6b6b;
    --line: #e8e2df;
    --lock-bg: #f5f2f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
  }
  .band {
    background: var(--crimson);
    color: var(--paper);
    padding: 40px 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .band .kicker {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin: 0 0 12px;
  }
  .band h1 {
    font-size: 28px;
    line-height: 1.15;
    margin: 0;
    max-width: 420px;
  }
  .signout {
    background: none;
    border: 1px solid rgba(255,255,255,0.5);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  #loading, #signedOutMsg {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--grey);
    text-align: center;
    padding: 60px 20px;
  }
  #signedOutMsg a { color: var(--crimson); }
  .stage-card {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .stage-card.locked {
    background: var(--lock-bg);
  }
  .stage-checkbox {
    width: 22px;
    height: 22px;
    accent-color: var(--crimson);
    margin-top: 3px;
    flex-shrink: 0;
  }
  .stage-body { flex: 1; }
  .stage-title {
    font-size: 19px;
    font-weight: bold;
    margin: 0 0 4px;
  }
  .stage-title.done { text-decoration: line-through; color: var(--grey); }
  .stage-desc {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--grey);
    margin: 0;
  }
  .lock-icon {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .upgrade-box {
    background: var(--ink);
    color: var(--paper);
    border-radius: 3px;
    padding: 28px 24px;
    text-align: center;
    margin-top: 24px;
  }
  .upgrade-box h2 {
    font-size: 22px;
    margin: 0 0 10px;
  }
  .upgrade-box p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: #cfcfcf;
    margin: 0 0 20px;
    line-height: 1.5;
  }
  .upgrade-box a.btn {
    display: inline-block;
    background: var(--crimson);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 2px;
    text-decoration: none;
  }
  .paid-refresh {
    text-align: center;
    margin-top: 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--grey);
  }
  .paid-refresh button {
    background: none;
    border: none;
    color: var(--crimson);
    text-decoration: underline;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  .guide-toggle {
    background: none;
    border: none;
    color: var(--crimson);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    margin-top: 10px;
  }
  .guide-content {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: none;
  }
  .guide-content.open { display: block; }
  .guide-item { margin-bottom: 16px; }
  .guide-item:last-child { margin-bottom: 0; }
  .guide-heading {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 13px;
    margin: 0 0 4px;
  }
  .guide-body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: #333;
    margin: 0;
  }
  .guide-links {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .guide-links-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--grey);
    margin: 0 0 8px;
  }
  .guide-link {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--crimson);
    text-decoration: none;
    margin-bottom: 6px;
  }
  .guide-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="band">
  <div>
    <p class="kicker">PROJECT ALANYA</p>
    <h1>Your Relocation Tracker</h1>
  </div>
  <button class="signout" id="signOutBtn">Sign out</button>
</div>

<main>
  <div id="loading">Loading your tracker...</div>
  <div id="signedOutMsg" style="display:none;">
    You're not signed in. <a href="/signin.html">Sign in here</a>.
  </div>
  <div id="trackerContent" style="display:none;"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://teebttgkvyjvdhpimjui.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlZWJ0dGdrdnlqdmRocGltanVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjYxMzIsImV4cCI6MjEwMzk0MjEzMn0.p8P5iEeeWjZ-NC0Ovu-jkRz0wIAgOLL1s6iHLv8V5Mc";
  const PAYHIP_URL = "https://payhip.com/b/zMV3C";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STAGES = [
    {
      key: "owns_property",
      title: "Property",
      desc: "Find and secure your place in Alanya.",
      free: true,
      guide: [
        {
          heading: "How renting actually works here",
          body: "Most listings run through a local emlakçı (estate agent) rather than sites like Airbnb once you're past the first month or two. Agents typically charge one month's rent as commission, paid once, at signing — not monthly."
        },
        {
          heading: "Before you sign anything",
          body: "Ask for the kira sözleşmesi (rental contract) in Turkish, even if you're given an English summary — the Turkish version is the one that legally counts. Confirm whether bills (aidat, the building maintenance fee) are included or separate, since this varies block to block."
        },
        {
          heading: "Where eligibility matters",
          body: "Not every district qualifies for a first-time ikamet application — some areas have hit their foreign-resident quota. Check the Districts page on this site before you commit to a specific neighbourhood, not after."
        },
        {
          heading: "Watch out for",
          body: "Verbal promises about included furniture or repairs mean nothing once you've paid — get anything agreed in writing, added as a clause, before handing over money."
        }
      ],
      links: [
        { label: "e-ikamet.goc.gov.tr — official residence permit portal", url: "https://e-ikamet.goc.gov.tr" },
        { label: "tkgm.gov.tr — official Land Registry & Cadastre", url: "https://www.tkgm.gov.tr" }
      ]
    },
    { key: "has_bank_account", title: "Banking", desc: "Open a Turkish bank account.", free: false,
      guide: [
        {
          heading: "Get your tax number first",
          body: "Before any bank will open an account, you need a Turkish Tax Identification Number (Vergi Numarası). It's free and quick — apply in person at the local tax office (Vergi Dairesi) with just your passport, or through Turkey's official Digital Tax Office site."
        },
        {
          heading: "Which bank to actually use",
          body: "Garanti BBVA is a solid, genuine recommendation — not just a personal habit. It's consistently one of the few major Turkish banks with proper English-language mobile banking and English-speaking staff in key branches, which matters far more day-to-day than people expect."
        },
        {
          heading: "What to bring",
          body: "Passport, your tax number, and proof of address — your signed rental contract from the Property stage covers this. Some branches also ask for a Turkish phone number, so sort your SIM before this appointment if you can."
        },
        {
          heading: "Watch out for",
          body: "Requirements can vary noticeably branch to branch, even within the same bank. If one branch tells you something's not possible, it's worth trying a second branch before assuming it's a hard rule."
        }
      ],
      links: [
        { label: "Garanti BBVA — official site", url: "https://www.garantibbva.com.tr" },
        { label: "GIB — Turkish Revenue Administration (tax number applications)", url: "https://www.gib.gov.tr" }
      ]
    },
    { key: "started_ikamet", title: "Ikamet", desc: "Start your residence permit application.", free: false,
      guide: [
        {
          heading: "Timing matters more than anything else",
          body: "You can only apply once you've physically entered Turkey, and you must submit your application before your visa-free entry stamp or visa expires — not after. There's no grace period, so mark the expiry date the moment you land."
        },
        {
          heading: "The actual process",
          body: "Everything starts online at e-ikamet.goc.gov.tr, where you fill in your details and get given an appointment date at your local Migration Directorate (Göç İdaresi) office — for Alanya, that's the Antalya provincial office. The appointment itself is usually short; the paperwork beforehand is where most of the real work happens."
        },
        {
          heading: "What you'll need at the appointment",
          body: "Your passport, four recent biometric photos (white background), a valid Turkish health insurance policy, proof of address (your signed rental contract from the Property stage), and proof you can financially support yourself — a bank statement is usually enough."
        },
        {
          heading: "Watch out for",
          body: "Your passport needs at least 60 days of validity left beyond your requested residence permit end date, or the application gets rejected outright. Check this before you book anything, not after."
        }
      ],
      links: [
        { label: "e-ikamet.goc.gov.tr — official application portal", url: "https://e-ikamet.goc.gov.tr" },
        { label: "goc.gov.tr — Directorate General of Migration Management", url: "https://www.goc.gov.tr" }
      ]
    },
    { key: "arranged_moving", title: "Moving day", desc: "Arrange shipping and your move date.", free: false,
      guide: [
        {
          heading: "This stage genuinely comes last",
          body: "Turkey's duty-free import allowance for household goods only applies once you hold a valid residence permit — so getting your ikamet sorted first isn't just a suggestion, it's what actually unlocks this benefit."
        },
        {
          heading: "The six-month clock",
          body: "You must declare your shipped household goods to Turkish customs within six months of your first entry, or you lose the duty-free exemption entirely. Start this conversation with a shipping company as soon as your ikamet is confirmed, not once your boxes are already packed."
        },
        {
          heading: "Sea vs air freight",
          body: "Sea freight is far cheaper for furniture and household goods but takes weeks, not days — plan for that gap and budget for temporary essentials on arrival. Air freight suits a small, urgent shipment, not a full house move."
        },
        {
          heading: "What you'll need for customs",
          body: "A full itemised inventory of what's being shipped (serial numbers for electronics), proof of your Turkish address, and your residence permit. You're not allowed to sell any of these duty-free imported items to anyone in Turkey afterwards — that voids the exemption and can trigger the duty retroactively."
        }
      ],
      links: [
        { label: "ticaret.gov.tr — Ministry of Trade (customs authority)", url: "https://ticaret.gov.tr" },
        { label: "trade.gov.tr — English-language customs information", url: "https://www.trade.gov.tr" }
      ]
    },
  ];

  const loadingEl = document.getElementById('loading');
  const signedOutEl = document.getElementById('signedOutMsg');
  const contentEl = document.getElementById('trackerContent');

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      loadingEl.style.display = 'none';
      signedOutEl.style.display = 'block';
      return;
    }

    const userId = session.user.id;

    // Fetch their profile row. The signup trigger should have created it already;
    // if it's not there yet (rare timing edge case), create a fallback row.
    let { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', userId)
      .single();

    if (error || !profile) {
      const { data: created } = await supabaseClient
        .from('profiles')
        .upsert({ id: userId, paid: false })
        .select()
        .single();
      profile = created;
    }

    renderTracker(profile);
  }

  function renderTracker(profile) {
    loadingEl.style.display = 'none';
    contentEl.style.display = 'block';
    contentEl.innerHTML = '';

    STAGES.forEach(stage => {
      const unlocked = stage.free || profile.paid;
      const done = !!profile[stage.key];

      const card = document.createElement('div');
      card.className = 'stage-card' + (unlocked ? '' : ' locked');

      if (unlocked) {
        const guideHtml = stage.guide ? `
          <button class="guide-toggle" data-toggle="${stage.key}">Show guide ▾</button>
          <div class="guide-content" id="guide-${stage.key}">
            ${stage.guide.map(item => `
              <div class="guide-item">
                <p class="guide-heading">${item.heading}</p>
                <p class="guide-body">${item.body}</p>
              </div>
            `).join('')}
            ${stage.links ? `
              <div class="guide-links">
                <p class="guide-links-label">Official resources</p>
                ${stage.links.map(link => `<a class="guide-link" href="${link.url}" target="_blank" rel="noopener">${link.label}</a>`).join('')}
              </div>
            ` : ''}
          </div>
        ` : '';
        card.innerHTML = `
          <input type="checkbox" class="stage-checkbox" data-key="${stage.key}" ${done ? 'checked' : ''}>
          <div class="stage-body">
            <p class="stage-title ${done ? 'done' : ''}">${stage.title}</p>
            <p class="stage-desc">${stage.desc}</p>
            ${guideHtml}
          </div>
        `;
      } else {
        card.innerHTML = `
          <span class="lock-icon">🔒</span>
          <div class="stage-body">
            <p class="stage-title">${stage.title}</p>
            <p class="stage-desc">${stage.desc}</p>
          </div>
        `;
      }
      contentEl.appendChild(card);
    });

    if (!profile.paid) {
      const upgrade = document.createElement('div');
      upgrade.className = 'upgrade-box';
      upgrade.innerHTML = `
        <h2>Unlock all 4 stages</h2>
        <p>One-time payment of £6.99 unlocks Banking, Ikamet and Moving day — lifetime access, no subscription.</p>
        <a class="btn" href="${PAYHIP_URL}" target="_blank">Unlock for £6.99</a>
        <div class="paid-refresh">Already paid? <button id="refreshBtn">Refresh status</button></div>
      `;
      contentEl.appendChild(upgrade);
      document.getElementById('refreshBtn').addEventListener('click', init);
    }

    // Wire up checkboxes to save progress live.
    contentEl.querySelectorAll('.stage-checkbox').forEach(box => {
      box.addEventListener('change', async (e) => {
        const key = e.target.dataset.key;
        const value = e.target.checked;
        await supabaseClient
          .from('profiles')
          .update({ [key]: value })
          .eq('id', profile.id);
        profile[key] = value;
        const titleEl = e.target.closest('.stage-card').querySelector('.stage-title');
        titleEl.classList.toggle('done', value);
      });
    });

    // Wire up "Show guide" toggles.
    contentEl.querySelectorAll('.guide-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.toggle;
        const guideEl = document.getElementById(`guide-${key}`);
        const isOpen = guideEl.classList.toggle('open');
        btn.textContent = isOpen ? 'Hide guide ▴' : 'Show guide ▾';
      });
    });
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/signin.html';
  });

  init();
</script>

</body>
</html>
